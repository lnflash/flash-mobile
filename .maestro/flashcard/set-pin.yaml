# A card this phone owns, with no PIN, gets one: ALLOW_LOAD (the owner's
# grant), then SET_PIN, sealed, in one tap ("ADD PIN").
appId: com.lnflash
name: Flashcard set PIN
tags: [flashcard]
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/owner-card.yaml
    env:
      FIXTURE: owned
- assertVisible:
    id: flashcard-v2-no-pin
- tapOn:
    id: flashcard-v2-action-set-pin
- assertVisible:
    id: pin-entry
- runFlow:
    file: subflows/new-pin.yaml
    env:
      NEW: "1234"
- extendedWaitUntil:
    visible:
      id: flashcard-v2-action-change-pin
    timeout: 20000
- assertNotVisible:
    id: flashcard-v2-no-pin
- runScript:
    file: scripts/verify-pin.js
    env:
      PIN: "1234"
