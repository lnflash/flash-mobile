# A card whose PIN was blocked by three wrong tries: the owner's screen says
# a new PIN unblocks it, and the owner's CHANGE_PIN does (no old PIN, the
# tries refilled; spec/APDU.md CHANGE_PIN). The owner can still top it up.
appId: com.lnflash
name: Flashcard PIN blocked, and unblocked by its owner
tags: [flashcard]
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/owner-card.yaml
    env:
      FIXTURE: blocked
- extendedWaitUntil:
    visible:
      id: flashcard-v2-blocked
    timeout: 20000
- assertVisible:
    id: flashcard-v2-action-topup
- runScript: scripts/card-state.js
- assertTrue: ${output.card.pinState === 2}
- tapOn:
    id: flashcard-v2-action-change-pin
- runFlow:
    file: subflows/new-pin.yaml
    env:
      NEW: "1234"
- extendedWaitUntil:
    visible:
      id: flashcard-v2-action-change-pin
    timeout: 20000
- assertNotVisible:
    id: flashcard-v2-blocked
- runScript: scripts/card-state.js
- assertTrue: ${output.card.pinState === 1}
- assertTrue: ${output.card.tries === 3}
- runScript:
    file: scripts/verify-pin.js
    env:
      PIN: "1234"
