# A tap reads the loaded card: 21 sat, the mint names the unit, PIN set.
appId: com.lnflash
name: Flashcard balance read
tags: [flashcard]
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/card.yaml
    env:
      FIXTURE: loaded
- extendedWaitUntil:
    visible:
      id: flashcard-v2-balance-sat
      text: ".*21.*"
    timeout: 20000
- assertVisible:
    id: flashcard-v2-action-change-pin
- assertVisible:
    id: flashcard-v2-action-remove-pin
- assertNotVisible:
    id: flashcard-v2-no-pin
# A second tap reads the same card again.
- tapOn:
    id: flashcard-v2-refresh
- assertVisible:
    id: flashcard-v2-balance-sat
    text: ".*21.*"
