# The owner tops up a card with two spent slots the mint holds SPENT: no PIN
# (the owner's grant, ALLOW_LOAD), the load tap frees the spent slots
# (CLEAR_SPENT, ENG-631) and loads the new format-4 SIG_ALL pieces, each with
# the mint's DLEQ proof (LOAD_PROOF P1 = 1). The dev pay stub stands in for
# the Cash wallet's payment (a FakeWallet mint marks its own quote paid), and
# with it on the Cash balance does not limit the amount, so the flow needs no
# funded account. A release build always checks the balance
# (topUpAmountProblem, and its spec). The new pieces fill the gaps around the
# 16 the card holds, so the whole card pays every amount up to its balance
# exactly (ENG-700). That such a piece is one the mint takes
# with the card's one SIG_ALL signature (a swap, NUT-07 SPENT after it) is
# shown below the UI in the same job, against the same cardsim and mint
# (__tests__/integration/card-topup-cardsim.spec.ts).
appId: com.lnflash
name: Flashcard top-up with reclaim
tags: [flashcard]
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/owner-card.yaml
    env:
      FIXTURE: spent
# The unit is the mint's to name; the top-up refuses a card without one.
- extendedWaitUntil:
    visible:
      id: flashcard-v2-balance-sat
    timeout: 20000
- tapOn:
    id: flashcard-v2-action-topup
- extendedWaitUntil:
    visible:
      id: "Key 1"
    timeout: 20000
# 100, not 1: a 1 beside the card's 16 leaves amounts 2 to 15 unpayable,
# which no shape can close. 100 fills the gaps around the 16 (ENG-700).
- tapOn:
    id: "Key 1"
- tapOn:
    id: "Key 0"
- tapOn:
    id: "Key 0"
- tapOn:
    id: amount-input-set
# The card has room once the spent slots are reclaimed, and the stub lifts
# the balance check: no refusal of any kind.
- assertNotVisible:
    id: topup-amount-problem-no-room
- assertNotVisible:
    id: topup-amount-problem-over-balance
- assertNotVisible:
    id: topup-amount-problem-too-much
- tapOn:
    id: topup-next
# This phone owns the card: no PIN is asked for.
- extendedWaitUntil:
    visible:
      id: topup-pay
    timeout: 30000
- assertNotVisible:
    id: topup-pin-entry
- tapOn:
    id: topup-pay
- extendedWaitUntil:
    visible:
      id: topup-load
    timeout: 60000
- tapOn:
    id: topup-load
- extendedWaitUntil:
    visible:
      id: topup-done
    timeout: 30000
- assertVisible:
    id: topup-reclaimed
- runScript: scripts/card-state.js
- assertTrue: ${output.card.counts.spent === 0}
- assertTrue: ${output.card.balance > 16}
# Every unspent piece on the card kept the mint's DLEQ proof beside it.
- runScript: scripts/dleq-kept.js
# The whole card, the 16 it held and the pieces the top-up added, pays every
# amount from 1 to its balance exactly: a covering ladder (ENG-700).
- runScript: scripts/covering-shape.js
- assertTrue: ${output.shape.total === output.card.balance}
