# Flashcard e2e flows (ENG-634). The top-level flows run, one by one, in the
# order below; subflows/ and scripts/ are their building blocks. See README.md.
flows:
  - "*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - balance-read
    - set-pin
    - change-pin
    - remove-pin
    - pin-session-reset
    - pin-blocked
    - topup
    - topup-full
