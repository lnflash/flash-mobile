# The owner changes the PIN: no current PIN, the owner's CHANGE_PIN (sealed)
# in one tap.
appId: com.lnflash
name: Flashcard change PIN
tags: [flashcard]
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/owner-card.yaml
    env:
      FIXTURE: loaded
- tapOn:
    id: flashcard-v2-action-change-pin
- runFlow:
    file: subflows/new-pin.yaml
    env:
      NEW: "5678"
- extendedWaitUntil:
    visible:
      id: flashcard-v2-action-change-pin
    timeout: 20000
- runScript:
    file: scripts/verify-pin.js
    env:
      PIN: "5678"
