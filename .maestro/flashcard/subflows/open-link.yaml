# Opens LINK in the app. iOS can ask "Open in “Flash”?" first (it does for a
# link that arrives while the app is starting): confirm it when it does.
appId: com.lnflash
---
- openLink: ${LINK}
# The prompt slides in a moment after the link is sent: a check made at once
# misses it, and a prompt left up is a system alert that outlives the app and
# covers every later flow (run 38177699648). Let it settle, then look.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Open in .Flash.\\?"
    commands:
      - tapOn: "Open"
