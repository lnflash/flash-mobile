# A phone that is not the card's owner tops up a card with a PIN: the PIN is
# checked with a tap before anything is paid. A wrong one costs a try and
# says so; the right one passes the check and puts the try counter back at
# three (VERIFY_PIN success resets it, spec/APDU.md VERIFY_PIN).
appId: com.lnflash
name: Flashcard wrong PIN, then the right one
tags: [flashcard]
---
- runFlow: subflows/login.yaml
# No owner key: another phone owns this card.
- runFlow:
    file: subflows/card.yaml
    env:
      FIXTURE: loaded
      OWNER_KEY: ""
- extendedWaitUntil:
    visible:
      id: flashcard-v2-balance-sat
    timeout: 20000
- assertNotVisible:
    id: flashcard-v2-action-change-pin
- tapOn:
    id: flashcard-v2-action-topup
- extendedWaitUntil:
    visible:
      id: "Key 1"
    timeout: 20000
- tapOn:
    id: "Key 1"
- tapOn:
    id: amount-input-set
- tapOn:
    id: topup-next
- extendedWaitUntil:
    visible:
      id: topup-pin-entry
    timeout: 20000
- runFlow:
    file: subflows/pin-entry.yaml
    env:
      PIN: "9999"
      NEXT_ID: topup-pin-submit
- extendedWaitUntil:
    visible:
      id: topup-error
    timeout: 20000
# The app's wrong PIN cost one try (3 -> 2); this costs another (2 -> 1).
- runScript:
    file: scripts/wrong-pin.js
    env:
      EXPECT_SW: "63C1"
- runFlow:
    file: subflows/pin-entry.yaml
    env:
      PIN: "1234"
      NEXT_ID: topup-pin-submit
- extendedWaitUntil:
    visible:
      id: topup-pay
    timeout: 30000
# Back at three: one more wrong PIN leaves two (63C2), not none.
- runScript:
    file: scripts/wrong-pin.js
    env:
      EXPECT_SW: "63C2"
