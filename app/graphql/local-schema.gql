extend type Transaction {
  date: String!
  date_format: String!
  date_nice_print: String!
  isReceive: Boolean!
  text: String!
}

type Contact {
  prettyName: String!
}

extend type Query {
  # Bounded, session-scoped offline assistant read projections. Never sent to the server.
  assistantSavedReads: String
  assistantSpeechPreference: String
  hideBalance: Boolean!
  hiddenBalanceToolTip: Boolean!
  price: String # FIXME test only?
  beta: Boolean!
  colorScheme: String!
  feedbackModalShown: Boolean!
  hasPromptedSetDefaultAccount: Boolean!
}

extend type Account {
  usdWallet: UsdWallet
  btcWallet: BTCWallet
  defaultWallet: Wallet
}

extend type ConsumerAccount {
  usdWallet: UsdWallet
  btcWallet: BTCWallet
  defaultWallet: Wallet
}
